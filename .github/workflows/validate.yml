name: Validate MiniLoot

on:
  push:
    branches: [new-features]
    paths:
      - '**/*.lua'
      - '**/*.toc'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.pkgmeta'
      - '.vscode/settings.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniloot-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/new-features'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SHA: ${{ github.sha }}
      MINILOOT_TEST_LUAC: /usr/bin/luac5.1
    steps:
      - name: Check out the event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\nActual SHA: %s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          git --version

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Prepare runner-only Lua 5.1 compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1
          python --version
          /usr/bin/luac5.1 -v

      - name: Run Python tests
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Validate manifests and Lua syntax
        run: python -B scripts/validate_addon.py --luac /usr/bin/luac5.1

      - name: Confirm tracked files and index were preserved
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
